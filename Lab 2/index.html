<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Makes the page fit the phone screen width (needed for responsiveness) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 2 - Responsive Navbar and Grid</title>

    <!-- Bootstrap CSS from CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- My own CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ========== NAVBAR ========== -->
    <!-- navbar-expand-md: full navbar from 768px up, hamburger menu below 768px -->
    <nav class="navbar navbar-expand-md navbar-dark bg-dark">
      <div class="container">
        <!-- Logo on the left -->
        <a class="navbar-brand" href="#">MyShop</a>

        <!-- Hamburger button (only visible below 768px) -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Everything inside here collapses on small screens -->
        <div class="collapse navbar-collapse" id="menu">
          <!-- mx-auto puts the links in the center on desktop -->
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a class="nav-link active" href="#">Home</a>
            </li>
            <li class="nav-item"><a class="nav-link" href="#">Shop</a></li>
            <li class="nav-item"><a class="nav-link" href="#">About</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
          </ul>

          <!-- Cart icon on the right -->
          <a class="nav-link text-white cart-icon" href="#">🛒 Cart</a>
        </div>
      </div>
    </nav>

    <!-- ========== PRODUCT GRID ========== -->
    <main class="container my-4">
      <h1 class="mb-4">Products</h1>

      <!-- row-cols-1  : 1 column on phones
         row-cols-md-2 : 2 columns from 768px (tablet)
         row-cols-lg-4 : 4 columns from 992px (desktop)
         g-4 : gap between cards -->
      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
        <div class="col">
          <div class="card h-100">
            <img
              src="https://placehold.co/400x300?text=Product+1"
              class="card-img-top"
              alt="Product 1"
            />
            <div class="card-body">
              <h5 class="card-title">Product 1</h5>
              <p class="card-text">Rs. 1,000</p>
            </div>
          </div>
        </div>

        <div class="col">
          <div class="card h-100">
            <img
              src="https://placehold.co/400x300?text=Product+2"
              class="card-img-top"
              alt="Product 2"
            />
            <div class="card-body">
              <h5 class="card-title">Product 2</h5>
              <p class="card-text">Rs. 2,000</p>
            </div>
          </div>
        </div>

        <div class="col">
          <div class="card h-100">
            <img
              src="https://placehold.co/400x300?text=Product+3"
              class="card-img-top"
              alt="Product 3"
            />
            <div class="card-body">
              <h5 class="card-title">Product 3</h5>
              <p class="card-text">Rs. 3,000</p>
            </div>
          </div>
        </div>

        <div class="col">
          <div class="card h-100">
            <img
              src="https://placehold.co/400x300?text=Product+4"
              class="card-img-top"
              alt="Product 4"
            />
            <div class="card-body">
              <h5 class="card-title">Product 4</h5>
              <p class="card-text">Rs. 4,000</p>
            </div>
          </div>
        </div>

        <div class="col">
          <div class="card h-100">
            <img
              src="https://placehold.co/400x300?text=Product+5"
              class="card-img-top"
              alt="Product 5"
            />
            <div class="card-body">
              <h5 class="card-title">Product 5</h5>
              <p class="card-text">Rs. 5,000</p>
            </div>
          </div>
        </div>

        <div class="col">
          <div class="card h-100">
            <img

            />
            <div class="card-body">
              <h5 class="card-title">Product 6</h5>

            </div>
          </div>
        </div>

        <div class="col">
          <div class="card h-100">
            <img
              src="https://placehold.co/400x300?text=Product+7"
              class="card-img-top"
              alt="Product 7"
            />
            <div class="card-body">
              <h5 class="card-title">Product 7</h5>
              <p class="card-text">Rs. 7,000</p>
            </div>
          </div>
        </div>

        <div class="col">
          <div class="card h-100">
            <img
              src="https://placehold.co/400x300?text=Product+8"
              class="card-img-top"
              alt="Product 8"
            />
            <div class="card-body">
              <h5 class="card-title">Product 8</h5>

      </div>
    </main>

    <!-- Bootstrap JS: needed only so the hamburger button opens and closes the menu -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
